name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: goofyrider_test
          POSTGRES_USER: goofyrider_user
          POSTGRES_PASSWORD: goofyrider_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goofyrider_user -d goofyrider_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://goofyrider_user:goofyrider_password@localhost:5432/goofyrider_test
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python -m pip check

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Install mobile deps
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze mobile
        working-directory: mobile
        run: flutter analyze

      - name: Run mobile tests
        working-directory: mobile
        run: flutter test
