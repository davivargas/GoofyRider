services:
  db:
    image: postgres:15
    container_name: fallline_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - goofyrider_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fallline_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      REFRESH_TOKEN_FAMILY_MAX_DAYS: ${REFRESH_TOKEN_FAMILY_MAX_DAYS:-90}
      JWT_ISSUER: ${JWT_ISSUER:-fall-line-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fall-line-mobile}
      DEBUG: ${DEBUG:-false}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-300}
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-10}
      RATE_LIMIT_LOGIN_PER_EMAIL: ${RATE_LIMIT_LOGIN_PER_EMAIL:-5}
      RATE_LIMIT_REGISTER_PER_IP: ${RATE_LIMIT_REGISTER_PER_IP:-5}
      RATE_LIMIT_REFRESH_PER_IP: ${RATE_LIMIT_REFRESH_PER_IP:-30}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      MAX_POINTS_PER_SESSION: ${MAX_POINTS_PER_SESSION:-200000}
      SKI_API_BASE_URL: ${SKI_API_BASE_URL:-https://api.skiapi.com/v1}
      SKI_API_HOST: ${SKI_API_HOST}
      SKI_API_KEY: ${SKI_API_KEY}
      SKI_API_PAGE_SIZE: ${SKI_API_PAGE_SIZE:-50}
      SKI_API_TIMEOUT_SECONDS: ${SKI_API_TIMEOUT_SECONDS:-10}
      RESORT_SYNC_ENABLED: ${RESORT_SYNC_ENABLED:-true}
      RESORT_SYNC_INTERVAL_DAYS: ${RESORT_SYNC_INTERVAL_DAYS:-7}
      OVERPASS_BASE_URL: ${OVERPASS_BASE_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_TIMEOUT_SECONDS: ${OVERPASS_TIMEOUT_SECONDS:-60}
    ports:
      - "8000:8000"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.scripts.import_resorts && uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]

volumes:
  goofyrider_postgres_data:
