services:
  db:
    image: postgres:15
    container_name: goofyrider_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - goofyrider_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goofyrider_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      SKI_API_BASE_URL: ${SKI_API_BASE_URL:-https://api.skiapi.com/v1}
      SKI_API_HOST: ${SKI_API_HOST}
      SKI_API_KEY: ${SKI_API_KEY}
      SKI_API_PAGE_SIZE: ${SKI_API_PAGE_SIZE:-50}
      SKI_API_TIMEOUT_SECONDS: ${SKI_API_TIMEOUT_SECONDS:-10}
      RESORT_SYNC_ENABLED: ${RESORT_SYNC_ENABLED:-true}
      RESORT_SYNC_INTERVAL_DAYS: ${RESORT_SYNC_INTERVAL_DAYS:-7}
    ports:
      - "8000:8000"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.scripts.import_resorts && uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]

volumes:
  goofyrider_postgres_data:
